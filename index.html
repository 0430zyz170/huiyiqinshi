      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      padding: 16px;
    }

    .game-container {
      width: 100%;
      max-width: 800px;
      background: #11100e;
      border: 1px solid #2a1f1a;
      box-shadow: 0 0 40px rgba(120, 30, 30, 0.2), inset 0 0 60px rgba(0, 0, 0, 0.8);
      padding: 28px 24px 36px;
      border-radius: 2px;
      position: relative;
      transition: all 0.15s;
      backdrop-filter: blur(1px);
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(80, 20, 20, 0.08) 0%, transparent 30%),
        radial-gradient(circle at 90% 70%, rgba(60, 10, 10, 0.1) 0%, transparent 40%),
        repeating-linear-gradient(45deg, rgba(255, 255, 255, 0.01) 0px, rgba(255, 255, 255, 0.01) 2px, transparent 2px, transparent 6px);
    }

    .glitch {
      animation: glitchShake 0.12s infinite;
    }

    @keyframes glitchShake {
      0% { transform: translate(0, 0) skew(0deg); }
      25% { transform: translate(-3px, 2px) skew(1deg); }
      50% { transform: translate(3px, -2px) skew(-1deg); }
      75% { transform: translate(-2px, -1px) skew(0.5deg); }
      100% { transform: translate(2px, 1px) skew(-0.5deg); }
    }

    .text-area {
      min-height: 160px;
      font-size: 1.25rem;
      line-height: 1.9;
      color: #c9b6a6;
      text-shadow: 0 0 6px rgba(180, 60, 60, 0.5), 0 0 20px rgba(80, 0, 0, 0.7);
      letter-spacing: 1px;
      padding: 8px 0 20px;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
      z-index: 5;
      transition: opacity 0.1s;
      font-weight: 400;
      border-bottom: 1px dashed #3a2820;
      margin-bottom: 24px;
      font-family: 'Courier New', Courier, monospace;
    }

    .text-area.unstable {
      color: #d44a4a;
      text-shadow: 0 0 10px #a00, 0 0 30px #500;
      animation: textFlicker 0.08s infinite;
    }

    @keyframes textFlicker {
      0% { opacity: 0.9; transform: translateX(0); }
      50% { opacity: 0.5; transform: translateX(1px); }
      100% { opacity: 0.8; transform: translateX(-1px); }
    }

      z-index: 5;
    }

      color: #b8a090;
      padding: 16px 20px;
      font-size: 1.05rem;
      font-family: 'Courier New', Courier, monospace;

      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.5px;
      border-radius: 2px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .option-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(180, 60, 60, 0.1), transparent);
      transition: left 0.4s;

      left: 100%;
    }

      transform: scale(0.98);
      background: #0f0b09;
    }

    .option-btn.disabled {
      opacity: 0.3;

      filter: grayscale(0.7);
    }

      border-radius: 1px;
    }

    .signal-strength span.active {

    }

    .love-overlay {
      position: fixed;

      height: 100%;

      z-index: 9999;

    }

      display: block;
    }

    }

    }

    }

    .game-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;

      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0px, transparent 2px, transparent 4px);

      color: #4a3028;
      letter-spacing: 2px;
      z-index: 15;
    }
  </style>
</head>

      // ----- 工具函数：随机乱码字符 -----
      function randomGlitchChar() {
        const chars = ['#', '@', '!', '?', '%', '&', '*', '×', '§', '¥', '€', '√', '∞', '♂', '♀', '☠', '✝', '☣'];
        return chars[Math.floor(Math.random() * chars.length)];
      }

      // ----- 显示全屏“我爱你” -----
      function showLoveOverlay(duration = 2500) {
        loveOverlay.innerHTML = '';
        loveOverlay.classList.add('active');

        const count = 60;
        for (let i = 0; i < count; i++) {
          const span = document.createElement('div');
          span.className = 'love-word';
          span.textContent = '我爱你';
          span.style.left = Math.random() * 95 + '%';
          span.style.top = Math.random() * 95 + '%';
          const rot = (Math.random() - 0.5) * 30;
          span.style.setProperty('--rot', rot + 'deg');
          const size = 1.2 + Math.random() * 3;
          span.style.fontSize = size + 'rem';
          span.style.animationDelay = (Math.random() * 0.5) + 's';
          span.style.animationDuration = (0.5 + Math.random() * 0.8) + 's';
          loveOverlay.appendChild(span);
        }

        setTimeout(() => {
          loveOverlay.classList.remove('active');
          loveOverlay.innerHTML = '';
        }, duration);
      }

      // ----- 信号不稳效果启动 -----
      function startGlitch(duration = 2000) {
        if (isGlitching) return;
        isGlitching = true;
        gameContainer.classList.add('glitch');
        textArea.classList.add('unstable');
        document.querySelectorAll('.option-btn').forEach(btn => {
          btn.style.textShadow = '0 0 8px #a00';
          btn.style.borderColor = '#6a1a1a';
        });

        const originalText = textArea.textContent;
        const glitchInterval = setInterval(() => {
          if (!isGlitching) {
            clearInterval(glitchInterval);
            return;
          }
          const chars = originalText.split('');
          for (let i = 0; i < chars.length; i++) {
            if (Math.random() > 0.7 && chars[i] !== '\n' && chars[i] !== ' ') {
              chars[i] = randomGlitchChar();
            }
          }
          textArea.textContent = chars.join('');
        }, 80);

        setTimeout(() => {
          clearInterval(glitchInterval);
          isGlitching = false;
          gameContainer.classList.remove('glitch');
          textArea.classList.remove('unstable');
          textArea.textContent = originalText;
          document.querySelectorAll('.option-btn').forEach(btn => {
            btn.style.textShadow = '';
            btn.style.borderColor = '';
          });
        }, duration);
      }

      // ----- 更新信号强度显示 -----
      function updateSignalDisplay() {
        const bars = signalStrength.querySelectorAll('span');
        const activeCount = Math.max(1, Math.floor(signalStability / 20));
        bars.forEach((bar, index) => {
          if (index < activeCount) {
            bar.classList.add('active');
          } else {
            bar.classList.remove('active');
          }
        });
      }

      // ----- 降低信号稳定性 -----
      function degradeSignal(amount = 8) {
        signalStability = Math.max(5, signalStability - amount);
        updateSignalDisplay();

        if (!isGlitching && Math.random() < 0.5) {
          const duration = 800 + Math.random() * 1800;
          startGlitch(duration);
        }

        if (signalStability < 30 && !isGlitching && Math.random() < 0.8) {
          const duration = 1500 + Math.random() * 2500;
          startGlitch(duration);
        }
      }

      // ----- 渲染章节 -----
      function renderChapter(index) {
        const chapter = story[index];
        if (!chapter) return;

        // 更新章节标记
        chapterMarker.textContent = `CHAPTER ${index}`;

        // 每进入新章节，信号降低
        if (index > 0) {
          degradeSignal(6 + Math.floor(Math.random() * 10));
        }

        let displayText = chapter.text;
        if (chapter.unstableText && isGlitching) {
          displayText = chapter.unstableText;
        }

        textArea.textContent = displayText;

        // 渲染选项
        optionsContainer.innerHTML = '';
        chapter.options.forEach(opt => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt.label;
          btn.dataset.option = opt.id;
          btn.addEventListener('click', () => {
            if (Math.random() < 0.4 && !isGlitching) {
              startGlitch(1200);
            }
            if (opt.next !== undefined && opt.next !== null) {
              currentChapter = opt.next;
              // 关键节点触发全屏我爱你
              if (currentChapter === 20 || currentChapter === 21 || currentChapter === 22 || currentChapter === 300) {
                showLoveOverlay(3000);
              }
              // 其他章节也有概率触发
              if (Math.random() < 0.15 && currentChapter > 5 && currentChapter !== 300) {
                showLoveOverlay(1500);
              }
              renderChapter(currentChapter);
            }
          });
          optionsContainer.appendChild(btn);
        });

        // 章节 >= 20 时增加信号不稳频率
        if (index >= 20) {
          if (glitchTimer) clearInterval(glitchTimer);
          glitchTimer = setInterval(() => {
            if (!isGlitching) {
              startGlitch(1000 + Math.random() * 2000);
            }
          }, 6000);
        } else {
          if (glitchTimer) {
            clearInterval(glitchTimer);
            glitchTimer = null;
          }
        }

        // 随机飘“我爱你”氛围
        if (Math.random() < 0.3 && index > 3) {
          showLoveOverlay(1200);
        }

        // 章节300特殊处理——满屏我爱你
        if (index === 300) {
          showLoveOverlay(5000);
          // 持续飘
          if (loveInterval) clearInterval(loveInterval);
          loveInterval = setInterval(() => {
            showLoveOverlay(800);
          }, 1200);
        } else {
          if (loveInterval) {
            clearInterval(loveInterval);
            loveInterval = null;
          }
        }
      }

      // ----- 初始化 -----
      function initGame() {
        currentChapter = 0;
        signalStability = 100;
        updateSignalDisplay();
        renderChapter(0);

        // 定时随机触发信号不稳
        setInterval(() => {
          if (!isGlitching && Math.random() < 0.2) {
            startGlitch(700 + Math.random() * 1300);
          }
        }, 8000);

        // 定时飘“我爱你”氛围
        setInterval(() => {
          if (currentChapter > 5 && Math.random() < 0.15) {
            showLoveOverlay(800);
          }
        }, 12000);
      }

      initGame();

      window.addEventListener('beforeunload', () => {
        if (glitchTimer) clearInterval(glitchTimer);
        if (loveInterval) clearInterval(loveInterval);
      });

    })();
  </script>
</body>

<!-- ========== 音效（Web Audio API 合成，无外部文件） ========== -->
<script>
(function(){
  // ---------- 音效引擎 ----------
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;
  function getCtx(){
    if(!audioCtx){ audioCtx = new AudioCtx(); }
    if(audioCtx.state === 'suspended'){ audioCtx.resume(); }
    return audioCtx;
  }

  function playTone(freq, duration, type, vol, sweepTo){
    try{
      const ctx = getCtx();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime);
      if(sweepTo){
        osc.frequency.exponentialRampToValueAtTime(sweepTo, ctx.currentTime + duration);
      }
      gain.gain.setValueAtTime(vol || 0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    }catch(e){}
  }

  function playNoise(duration, vol){
    try{
      const ctx = getCtx();
      const bufferSize = ctx.sampleRate * duration;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for(let i=0;i<bufferSize;i++){
        data[i] = (Math.random()*2-1) * (1 - i/bufferSize);
      }
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(vol || 0.06, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 800;
      filter.Q.value = 2;
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start();
    }catch(e){}
  }

  window.SFX = {
    hover: function(){ playTone(880, 0.06, 'sine', 0.025); },
    click: function(){ playTone(440, 0.1, 'triangle', 0.06, 220); },
    glitch: function(){ playNoise(0.3, 0.05); playTone(120, 0.15, 'sawtooth', 0.04, 60); },
    love: function(){
      playTone(523, 0.4, 'sine', 0.05);
      setTimeout(()=>playTone(659, 0.4, 'sine', 0.04), 100);
      setTimeout(()=>playTone(784, 0.6, 'sine', 0.04), 200);
    },
    save: function(){ playTone(660, 0.08, 'square', 0.04); setTimeout(()=>playTone(880, 0.12, 'square', 0.04), 80); },
    load: function(){ playTone(880, 0.08, 'square', 0.04); setTimeout(()=>playTone(660, 0.12, 'square', 0.04), 80); }
  };

  // ---------- 玩家档案 ----------
  const profile = {
    name: '未命名',
    avatar: null
  };

  const avatarDisplay = document.getElementById('avatarDisplay');
  const playerNameEl = document.getElementById('playerName');
  const editModal = document.getElementById('editModal');
  const nameInput = document.getElementById('nameInput');
  const avatarInput = document.getElementById('avatarInput');

  function updateProfileUI(){
    playerNameEl.textContent = profile.name || '未命名';
    if(profile.avatar){
      avatarDisplay.style.backgroundImage = `url(${profile.avatar})`;
      avatarDisplay.textContent = '';
    } else {
      avatarDisplay.style.backgroundImage = 'none';
      avatarDisplay.textContent = (profile.name || '?').charAt(0).toUpperCase();
    }
  }

  document.getElementById('editProfileBtn').addEventListener('click', ()=>{
    SFX.click();
    nameInput.value = profile.name;
    avatarInput.value = '';
    editModal.style.display = 'flex';
  });

  document.getElementById('cancelEdit').addEventListener('click', ()=>{
    SFX.click();
    editModal.style.display = 'none';
  });

  document.getElementById('confirmEdit').addEventListener('click', ()=>{
    SFX.click();
    const newName = nameInput.value.trim() || '未命名';
    profile.name = newName;

    const file = avatarInput.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(e){
        profile.avatar = e.target.result;
        updateProfileUI();
        editModal.style.display = 'none';
        saveToStorage();
      };
      reader.readAsDataURL(file);
    } else {
      updateProfileUI();
      editModal.style.display = 'none';
      saveToStorage();
    }
  });

  // ---------- 存档 / 读档 ----------
  function saveToStorage(){
    const saveData = {
      profile: profile,
      chapter: (typeof currentChapter !== 'undefined') ? currentChapter : 0,
      signal: (typeof signalStability !== 'undefined') ? signalStability : 100,
      timestamp: Date.now()
    };
    try{
      localStorage.setItem('huiyi_save', JSON.stringify(saveData));
    }catch(e){}
  }

  document.getElementById('saveBtn').addEventListener('click', ()=>{
    SFX.save();
    saveToStorage();
    const btn = document.getElementById('saveBtn');
    const old = btn.textContent;
    btn.textContent = '已存';
    setTimeout(()=>btn.textContent = old, 900);
  });

  document.getElementById('loadBtn').addEventListener('click', ()=>{
    SFX.load();
    try{
      const raw = localStorage.getItem('huiyi_save');
      if(!raw){
        const btn = document.getElementById('loadBtn');
        const old = btn.textContent;
        btn.textContent = '无档';
        setTimeout(()=>btn.textContent = old, 900);
        return;
      }
      const data = JSON.parse(raw);
      if(data.profile){
        profile.name = data.profile.name || '未命名';
        profile.avatar = data.profile.avatar || null;
        updateProfileUI();
      }
      if(typeof data.chapter === 'number' && typeof renderChapter === 'function'){
        currentChapter = data.chapter;
        if(typeof signalStability !== 'undefined' && typeof data.signal === 'number'){
          signalStability = data.signal;
        }
        if(typeof updateSignalDisplay === 'function'){ updateSignalDisplay(); }
        renderChapter(currentChapter);
      }
      const btn = document.getElementById('loadBtn');
      const old = btn.textContent;
      btn.textContent = '已读';
      setTimeout(()=>btn.textContent = old, 900);
    }catch(e){}
  });

  // ---------- 雷达框逻辑 ----------
  const radarBox = document.getElementById('radarBox');
  const dotSelf = document.getElementById('dotSelf');
  const dotHim = document.getElementById('dotHim');
  const radarLabel = document.getElementById('radarLabel');

  let radarActive = false;
  let radarInterval = null;
  let himAngle = 0;
  let himDistance = 40;

  // 雷达框尺寸（内部 130x80）
  const FIELD_W = 130;
  const FIELD_H = 80;

  function updateRadar(){
    const cx = FIELD_W / 2;
    const cy = FIELD_H / 2;

    // 自己始终在中心（稍微随机抖动，像心跳）
    const selfJitterX = (Math.random()-0.5) * 3;
    const selfJitterY = (Math.random()-0.5) * 3;
    dotSelf.style.left = `calc(50% + ${selfJitterX}px)`;
    dotSelf.style.top = `calc(50% + ${selfJitterY}px)`;

    // 张泽禹红点：绕中心旋转，距离随时间波动
    himAngle += 0.03 + Math.random() * 0.04;
    himDistance = 18 + Math.sin(Date.now() * 0.001) * 12 + Math.random() * 8;

    const hx = cx + Math.cos(himAngle) * himDistance;
    const hy = cy + Math.sin(himAngle) * himDistance;

    // 越靠近中心越危险
    const distFromCenter = Math.sqrt((hx-cx)*(hx-cx) + (hy-cy)*(hy-cy));
    const maxDist = Math.min(FIELD_W, FIELD_H) / 2;

    dotHim.style.left = `${hx}px`;
    dotHim.style.top = `${hy}px`;

    // 危险程度
    const danger = 1 - (distFromCenter / maxDist);

    if(danger > 0.75){
      radarBox.classList.add('danger');
      radarLabel.textContent = '他在你身后';
      radarLabel.style.color = '#f22';
    } else if(danger > 0.5){
      radarBox.classList.remove('danger');
      radarLabel.textContent = '他靠近了';
      radarLabel.style.color = '#f66';
    } else {
      radarBox.classList.remove('danger');
      radarLabel.textContent = '信号搜索中…';
      radarLabel.style.color = '#a33';
    }

    // 红点大小随距离变化
    const size = 8 + danger * 8;
    dotHim.style.width = size + 'px';
    dotHim.style.height = size + 'px';
  }

  function showRadar(){
    if(radarActive) return;
    radarActive = true;
    radarBox.style.display = 'block';
    dotHim.style.left = '50%';
    dotHim.style.top = '50%';
    radarLabel.textContent = '信号搜索中…';

    // 播放一次雷达启动音
    SFX.glitch();

    if(radarInterval) clearInterval(radarInterval);
    radarInterval = setInterval(updateRadar, 120);
  }

  function hideRadar(){
    if(!radarActive) return;
    radarActive = false;
    radarBox.style.display = 'none';
    radarBox.classList.remove('danger');
    if(radarInterval){ clearInterval(radarInterval); radarInterval = null; }
  }

  // 监听剧情文本变化，检测“身后”关键词
  const originalTextArea = document.getElementById('textArea');
  if(originalTextArea){
    const observer = new MutationObserver(function(){
      const txt = originalTextArea.textContent || '';
      if(txt.includes('身后') || txt.includes('在后面') || txt.includes('背后')){
        showRadar();
      } else if(!txt.includes('身后') && !txt.includes('背后') && radarActive){
        // 如果文本完全不再出现身后相关，延迟关闭
        setTimeout(()=>{
          const nowTxt = originalTextArea.textContent || '';
          if(!nowTxt.includes('身后') && !nowTxt.includes('背后')){
            hideRadar();
          }
        }, 4000);
      }
    });
    observer.observe(originalTextArea, { childList:true, characterData:true, subtree:true });
  }

  // ---------- 全局音效绑定 ----------
  // 选项悬停 & 点击
  document.addEventListener('mouseover', function(e){
    if(e.target.classList && e.target.classList.contains('option-btn')){
      SFX.hover();
    }
  });
  document.addEventListener('click', function(e){
    if(e.target.classList && e.target.classList.contains('option-btn')){
      SFX.click();
    }
  });

  // 监听全屏我爱你的出现（通过观察 loveOverlay 的 class 变化）
  const loveOverlayEl = document.getElementById('loveOverlay');
  if(loveOverlayEl){
    const loveObserver = new MutationObserver(function(){
      if(loveOverlayEl.classList.contains('active')){
        SFX.love();
      }
    });
    loveObserver.observe(loveOverlayEl, { attributes:true, attributeFilter:['class'] });
  }

  // 监听信号不稳（观察 gameContainer 的 class 变化）
  const gameContainerEl = document.getElementById('gameContainer');
  if(gameContainerEl){
    let lastGlitch = false;
    const glitchObserver = new MutationObserver(function(){
      const nowGlitch = gameContainerEl.classList.contains('glitch');
      if(nowGlitch && !lastGlitch){
        SFX.glitch();
      }
      lastGlitch = nowGlitch;
    });
    glitchObserver.observe(gameContainerEl, { attributes:true, attributeFilter:['class'] });
  }

  // ---------- 初始化 ----------
  // 尝试从 localStorage 读取上次的档案
  try{
    const raw = localStorage.getItem('huiyi_save');
    if(raw){
      const data = JSON.parse(raw);
      if(data.profile){
        profile.name = data.profile.name || '未命名';
        profile.avatar = data.profile.avatar || null;
      }
    }
  }catch(e){}
  updateProfileUI();

  // 暴露一些接口，方便外部调用
  window.HuiyiSave = {
    save: saveToStorage,
    load: function(){
      document.getElementById('loadBtn').click();
    },
    showRadar: showRadar,
    hideRadar: hideRadar,
    setProfile: function(name, avatar){
      profile.name = name;
      profile.avatar = avatar;
      updateProfileUI();
    }
  };

})();
</script>
